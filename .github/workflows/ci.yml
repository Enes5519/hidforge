name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # System libraries the GUI toolkit (gpui) links against.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev
          libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The root helper must not link the GUI toolkit (see AUDIT_REPORT.md, M1).
      - run: |
          cargo build --locked --bin hidforge-helper
          ! nm -C target/debug/hidforge-helper | grep -qiE 'gpui|tokio|zbus'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
