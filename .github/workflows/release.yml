name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: the same build, packaging and verification, but nothing is attested or published
  # (the publish job only runs for a tag push). Start it from the Actions tab.
  workflow_dispatch:

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Oldest supported runner: binaries link its (older) glibc, so they run on newer distros too.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Version (and tag) must be consistent
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          # X.Y.Z or a release candidate X.Y.Z-rc.N (the tag is the same with a leading v).
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "Cargo.toml version '$v' is not X.Y.Z or X.Y.Z-rc.N"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$v"; exit 1; }
          else
            echo "dry run on $GITHUB_REF_NAME: no tag to compare, Cargo.toml says $v"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # System libraries the GUI toolkit (gpui) links against.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev
          libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan-dev
          libfuse2
      - run: cargo build --release --locked

      - name: tar.gz
        run: packaging/make-tarball.sh "$VERSION"

      - name: deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --output hidforge_${VERSION}_amd64.deb

      - name: AppImage
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          # Pinned tool: refuse a swapped download.
          echo "4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy
          # linuxdeploy names the icon after the file; the desktop entry says Icon=hidforge.
          cp assets/brand/icons/hidforge-256.png hidforge.png
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir \
            -e target/release/hidforge \
            -d assets/hidforge.desktop \
            -i hidforge.png
          # The root helper is copied after linuxdeploy: a later linuxdeploy run would add an RPATH to it.
          install -Dm755 target/release/hidforge-helper AppDir/usr/bin/hidforge-helper
          # Pack with linuxdeploy's own AppImage plugin (same pinned download), which only packs.
          ./linuxdeploy --appimage-extract >/dev/null
          squashfs-root/plugins/linuxdeploy-plugin-appimage/usr/bin/linuxdeploy-plugin-appimage --appdir AppDir
          # linuxdeploy names the file from $VERSION; fail if that ever changes.
          test -f hidforge-$VERSION-x86_64.AppImage

      - run: sha256sum hidforge-*.tar.gz hidforge_*.deb hidforge-*.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 7
          path: |
            hidforge-*.tar.gz
            hidforge_*.deb
            hidforge-*.AppImage
            SHA256SUMS

  # Runs for a dry run too. Read-only: it cannot publish anything.
  verify:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      # The checks run the GUI binary headless (`hidforge --check`), so its libraries must resolve.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev
          libxkbcommon-x11-dev libssl-dev libzstd-dev libvulkan-dev
      # Checksums, archive contents, helper version and linkage, glibc ceiling of the binaries
      # (ubuntu-22.04 ships 2.35), .deb paths and version, AppImage contents.
      - name: Verify artifacts
        env:
          GLIBC_MAX: "2.35"
        run: packaging/verify-artifacts.sh "${{ needs.build.outputs.version }}" dist
      - name: Summary
        run: |
          {
            echo "### Release check"
            echo "- version: \`${{ needs.build.outputs.version }}\`, event: \`$GITHUB_EVENT_NAME\`, ref: \`$GITHUB_REF_NAME\`"
            echo "- repository private: \`${{ github.event.repository.private }}\` (attestations need a public repository)"
            if [ "$GITHUB_EVENT_NAME" = push ]; then echo "- publishing: yes, if this job passes"; else echo "- **dry run: nothing is attested, tagged or published**"; fi
            echo; echo '```'; (cd dist && ls -l && cat SHA256SUMS); echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Only for a pushed v* tag, and only when the build and every check above succeeded.
  publish:
    needs: [build, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the release
      id-token: write # sign attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      # Same bytes that were verified: checksums must still match before upload.
      - run: cd dist && sha256sum -c SHA256SUMS
      # Build provenance (`gh attestation verify`); GitHub only offers it for public repos on the free plan.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/hidforge-*.tar.gz
            dist/hidforge_*.deb
            dist/hidforge-*.AppImage
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # X.Y.Z-rc.N is a pre-release, never "latest".
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: |
            dist/hidforge-*.tar.gz
            dist/hidforge_*.deb
            dist/hidforge-*.AppImage
            dist/SHA256SUMS
